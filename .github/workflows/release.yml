name: 🚀 Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@af5bad1a47ab8f8c333f8910f06c1938dd962dac # v9.43.0
    permissions:
      contents: write
      pull-requests: write

  publish:
    name: Publish
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted publishing signs the package with a short lived OIDC token, so there is no
      # NPM_TOKEN in secrets. Configure the trusted publisher per package on npmjs.com first.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish ${{ matrix.path }}
        working-directory: ${{ matrix.path }}
        # pnpm reads only access and registry from publishConfig, so provenance has to be a
        # flag. With the flag a signing failure fails the job instead of publishing unsigned.
        run: pnpm publish --no-git-checks --provenance
