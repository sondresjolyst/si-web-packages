name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      path:
        description: "Package to stage again, such as packages/app-kit. For a tagged release that did not reach npm."
        type: string
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@af5bad1a47ab8f8c333f8910f06c1938dd962dac # v9.43.0
    permissions:
      contents: write
      pull-requests: write

  stage:
    name: Stage on npm
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.path) || needs.release-please.outputs.paths_released) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Install npm
        run: npm install --global npm@11.19.0

      - name: Stage ${{ matrix.path }}
        working-directory: ${{ matrix.path }}
        run: npm stage publish . --provenance --access public
